<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UR5 VLM Pick & Place</title>
<style>
:root{--bg:#0f1318;--card:#171d25;--line:#263140;--txt:#e6ebf2;--dim:#8a98ab;--acc:#4da3ff;--ok:#3fb97a;--warn:#e6a23c;--bad:#e5534b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--dim);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.busy{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:14px;padding:14px 18px;height:calc(100% - 52px)}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:0}
.card h2{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:600}
#cam{width:100%;aspect-ratio:4/3;background:#0a0d11;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--dim)}
#cam img{width:100%;height:100%;object-fit:contain;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #202a37}.kv:last-child{border:0}
.kv b{font-weight:550}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.bar{height:6px;background:#202a37;border-radius:4px;position:relative;margin:2px 0 7px}
.bar i{position:absolute;top:-1px;width:3px;height:8px;border-radius:2px;background:var(--acc);transform:translateX(-50%)}
.bar:after{content:"";position:absolute;left:50%;top:0;width:1px;height:6px;background:#3b4a5e}
.jl{display:flex;justify-content:space-between;color:var(--dim);font-size:11.5px}
.obj{display:flex;align-items:center;gap:9px;padding:4px 0}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid #0006}
.tag{margin-left:auto;font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tag.basket{color:var(--ok);border-color:#2b6a4b}.tag.held{color:var(--acc);border-color:#2b5a8f}
.prog{height:6px;background:#202a37;border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#chatcard{flex:1;display:flex;flex-direction:column}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;min-height:140px}
.m{max-width:92%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.m.user{align-self:flex-end;background:#1f4d84;border-bottom-right-radius:3px}
.m.robot{align-self:flex-start;background:#202a37;border-bottom-left-radius:3px}
.m small{display:block;color:#ffffff80;font-size:10.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);padding:3px 10px;border-radius:99px;font-size:12px}
.chip:hover{color:var(--txt);border-color:var(--acc)}
form{display:flex;gap:8px}
input[type=text]{flex:1;background:#0f141b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
button.b{background:var(--acc);color:#04121f;border:0;border-radius:8px;padding:0 16px;font-weight:650;cursor:pointer}
button.b.sec{background:#202a37;color:var(--txt)}button.b.red{background:#5a2321;color:#ffd9d6}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:#0f141b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#log{height:120px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--dim)}
#log div b{color:#5f7089;font-weight:500;margin-right:6px}
@media(max-width:980px){main{grid-template-columns:1fr;height:auto}}
</style></head>
<body>
<header>
  <h1>UR5 · VLM Pick &amp; Place</h1>
  <span class="pill"><span class="dot" id="d-state"></span><span id="t-state">connecting…</span></span>
  <span class="pill"><span class="dot" id="d-sim"></span><span id="t-sim">simulator</span></span>
  <span class="pill"><span class="dot" id="d-vlm"></span><span id="t-vlm">planner</span></span>
</header>
<main>
  <div class="col">
    <div class="card"><h2>Camera</h2><div id="cam"><span id="camtxt">waiting for camera…</span><img id="img" style="display:none" alt="camera"></div></div>
    <div class="grid2">
      <div class="card"><h2>Robot</h2>
        <div class="kv"><span>Doing</span><b id="phase">–</b></div>
        <div class="kv"><span>Gripper</span><b id="grip">–</b></div>
        <div class="kv"><span>TCP (m)</span><b class="mono" id="tcp">–</b></div>
        <div class="prog"><i id="prog"></i></div>
        <h2 style="margin-top:12px">Joints (deg)</h2><div id="joints"></div>
      </div>
      <div class="card"><h2>Objects <span id="basketcount" style="float:right;text-transform:none;letter-spacing:0"></span></h2><div id="objs"></div></div>
    </div>
  </div>
  <div class="col">
    <div class="card" id="chatcard"><h2>Chat</h2>
      <div id="chat"></div>
      <div class="chips" id="chips"></div>
      <form id="f"><input id="in" type="text" placeholder="e.g. put the red cube in the basket" autocomplete="off"><button class="b" type="submit">Send</button></form>
    </div>
    <div class="card"><h2>Controls</h2>
      <div class="row">
        <button class="b red" id="stop">■ Stop</button><button class="b sec" id="reset">↺ Reset scene</button>
        <span style="margin-left:auto;color:var(--dim)">Planner</span>
        <select id="mode"><option value="vlm">VLM (small model)</option><option value="rules">Rules only</option></select>
      </div>
      <div id="plan" class="mono" style="margin-top:10px;color:var(--dim)"></div>
    </div>
    <div class="card"><h2>Log</h2><div id="log"></div></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const chips=["Put the red cube in the basket","Pick up the blue cube","Take the green cylinder","Tidy up everything","What do you see?","Put it back on the table","Go home"];
$("chips").innerHTML=chips.map(c=>`<button type="button" class="chip">${c}</button>`).join("");
$("chips").onclick=e=>{if(e.target.classList.contains("chip"))send(e.target.textContent)};
$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value;$("in").value="";send(v)};
async function post(p,b){try{await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})}catch(e){}}
function send(t){if(t&&t.trim())post("/api/chat",{text:t})}
$("stop").onclick=()=>post("/api/stop");$("reset").onclick=()=>post("/api/reset");
$("mode").onchange=e=>post("/api/planner",{mode:e.target.value});
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let lastChat="",lastLog="",modeSet=false;
function dot(id,cls){$(id).className="dot "+cls}
function render(s){
  const st=s.status;dot("d-state",s.busy?"busy":(s.ready?"ok":"warn"));$("t-state").textContent=st+(s.progress.of?` (${s.progress.step}/${s.progress.of})`:"");
  const sim=s.backend;dot("d-sim",sim.status.startsWith("ok")?"ok":"warn");
  $("t-sim").textContent=sim.name+(sim.rtf!=null?` · RTF ${sim.rtf.toFixed(2)}`:"")+(sim.status.startsWith("ok")?"":` · ${sim.status}`);
  const p=s.planner;dot("d-vlm",p.mode==="rules"?"warn":(p.vlm_ok===false?"bad":(p.vlm_ok?"ok":"warn")));
  $("t-vlm").textContent=p.mode==="rules"?"rules planner":("VLM "+(p.vlm_ok===false?"offline → rules":p.vlm_ok?"online":"idle"));
  if(!modeSet){$("mode").value=p.mode;modeSet=true}
  $("phase").textContent=s.phase||"idle";$("grip").textContent=s.gripper;$("tcp").textContent=s.tcp.map(v=>v.toFixed(3)).join(", ");
  $("prog").style.width=s.busy&&s.progress.of?Math.round(100*(s.progress.step-0.5)/s.progress.of)+"%":"0";
  $("joints").innerHTML=s.joints_deg.map((v,i)=>`<div class="jl"><span>${s.joint_names[i].replace("_joint","")}</span><span class="mono">${v.toFixed(0)}°</span></div><div class="bar"><i style="left:${Math.max(0,Math.min(100,50+v/3.6))}%"></i></div>`).join("");
  $("objs").innerHTML=s.objects.map(o=>`<div class="obj"><span class="sw" style="background:${o.color}"></span><span>${o.label}</span><span class="tag ${o.where}">${o.where}</span></div>`).join("");
  $("basketcount").textContent=`${s.in_basket}/${s.objects.length} in basket`;
  const lp=p.last||{};$("plan").textContent=lp.source?`last plan: ${lp.source} · ${lp.latency}s · `+(lp.steps.map(x=>x.action+(x.object?":"+x.object:"")).join(" → ")||"no motion"):"";
  const cj=JSON.stringify(s.chat);if(cj!==lastChat){lastChat=cj;const c=$("chat");const near=c.scrollHeight-c.scrollTop-c.clientHeight<60;
    c.innerHTML=s.chat.map(m=>`<div class="m ${m.role}">${esc(m.text)}<small>${m.t}</small></div>`).join("");if(near||true)c.scrollTop=c.scrollHeight}
  const lj=JSON.stringify(s.log);if(lj!==lastLog){lastLog=lj;const l=$("log");l.innerHTML=s.log.map(x=>`<div><b>${x.t}</b>${esc(x.text)}</div>`).join("");l.scrollTop=l.scrollHeight}
}
async function poll(){try{const r=await fetch("/api/state");render(await r.json())}catch(e){$("t-state").textContent="server unreachable";dot("d-state","bad")}setTimeout(poll,400)}
poll();
const img=$("img");let camOk=false;
function frame(){fetch("/api/frame.jpg?t="+Date.now()).then(r=>r.status===200?r.blob():null).then(b=>{
  if(b){img.src=URL.createObjectURL(b);img.style.display="block";$("camtxt").style.display="none";camOk=true}
}).catch(()=>{}).finally(()=>setTimeout(frame,camOk?160:800))}
img.onload=()=>URL.revokeObjectURL(img.src);frame();
</script></body></html>
